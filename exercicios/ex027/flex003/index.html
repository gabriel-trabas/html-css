<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox center</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: sandybrown;
        }
        main{
            background-color:aqua;
            width: 90vw;
            height: 90vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }
        section{
            background-color:brown;
            width: 400px;
            height: 400px;
            display: flex;
           
        }
        section > h1{
           
            margin: auto;
            
          
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>centralizando tudo</h1>
        </section>
    </main>
</body>
</html>
