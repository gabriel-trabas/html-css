<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            background-color: aqua;
            display: flex;
        }
        .item{
            background-color: blueviolet;
            border: 2px solid black;
            flex-basis:  250px;
            text-align: center;
            flex-shrink: 1;
            flex-grow: 1;
        }
           
    </style>
</head>
<body>
    
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
       
    </div>
</body>
</html>
