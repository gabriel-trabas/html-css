<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container{
            background-color: aqua;
            display: flex;
        }
        .item{
            background-color: blueviolet;
            border: 2px solid black;
            flex: auto;
            text-align: center;
        }
           
    </style>
</head>
<body>
    
    <div class="container">
        <div class="item" style="order: 5;">A</div>
        <div class="item" style="order: 1;">B</div>
        <div class="item" style="order: 0;">C</div>
        <div class="item" style="order: -1;">D</div>
        <div class="item" style="order: 0;">E</div>
        <div class="item" style="order: 0;">f</div>
        <div class="item" style="order: -2;">G</div>
    </div>
</body>
</html>
